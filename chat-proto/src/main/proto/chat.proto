syntax = "proto3";

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.anisala.chat.proto";
option java_outer_classname = "ChatProto";

package chat;

service ChatService {
	// legacy method. might remove later
    rpc SendMessage(SendMessageRequest)
        returns (SendMessageResponse);
    
    rpc ChatStream(stream ChatMessage)
    	returns (stream ChatMessage);
    
    // rpc MetaData(MetaDataRequest)
    	// returns (MetaDataResponse);
}

service UserService {
    rpc GetUser(GetUserRequest)
    	returns (UserObj);

    rpc LogIn(LogInRequest)
    	returns (LogInResponse);

    rpc LogOut(LogOutRequest)
    	returns (LogOutResponse);

    rpc CreateUser(UserObj)
    	returns (CreateUserResponse);

    rpc GetLastSeen(GetLastSeenRequest)
    	returns (GetLastSeenResponse);

    rpc CheckOnline(CheckOnlineRequest)
    	returns (CheckOnlineResponse);

    rpc UpdateLastSeen(UpdateLastSeenRequest)
    	returns (UpdateLastSeenResponse);

    rpc GetUserById(GetUserByIdRequest)
    	returns (UserObj);
}

service FileTransferService {
    rpc UploadFile(stream FileChunk)
    	returns (UploadResponse);
    
    rpc DownloadFile(DownloadRequest)
    	returns (stream FileChunk);

    rpc RequestFileTransfer(RequestFileTransferRequest)
    	returns (RequestFileTransferResponse);

}

message SendMessageRequest {
    string sender_id = 1;
    string receiver_id = 2;
    string message = 3;
    google.protobuf.Timestamp time_stamp = 4;
}

message SendMessageResponse {
    bool success = 1;
    string message = 2;
}

message UserObj{
	string user_id = 1;
	string name = 2;
	string user_name = 3;
}

message GetUserRequest{
	string user_name = 1;
}

message ChatMessage{
	string sender_id = 1;
	string receiver_id = 2;
	string message = 3;
	google.protobuf.Timestamp time_stamp = 4;
}

message LogInRequest{
	string user_name = 1;
}

message LogInResponse{
	UserObj user = 1;
	string message = 2;
}

message LogOutRequest{
	string user_id = 1;
}

message LogOutResponse{
	string message = 2;
}

message CreateUserResponse{
	bool success = 1;
	string message = 2;
}

message FileChunk{
    string transfer_id = 1;
    string file_name = 2;
    int64 file_size = 3;
    int64 chunk_size = 4;
    int64 chunk_number = 5;
    int64 total_chunks = 6;
    bytes data = 7;
    bool last_chunk = 8;
}

message UploadResponse{
	bool success = 1;
	string transfer_id = 2;
	string message = 3;
}

message DownloadRequest{
	string transfer_id = 1;
	string file_name = 2;
}

message RequestFileTransferRequest{
	string file_name = 1;
	string user_id = 2;
	string transfer_id = 3;
}

message RequestFileTransferResponse{
	bool success = 1;
	string user_id = 2;
	string transfer_id = 3;
}

message CheckOnlineRequest {
    string user_name = 1;
}

message CheckOnlineResponse {
    bool is_online = 1;
    UserObj user = 2;
}

message GetUserByIdRequest {
    string user_id = 1;
}

message GetLastSeenRequest {
    string user_id = 1;
}

message GetLastSeenResponse {
    google.protobuf.Timestamp last_seen = 1;
}

message UpdateLastSeenRequest {
    string user_id = 1;
    google.protobuf.Timestamp last_seen = 2;
}

message UpdateLastSeenResponse {
    string message = 1;
}
