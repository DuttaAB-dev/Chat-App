syntax = "proto3";

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.anisala.chat.proto";
option java_outer_classname = "ChatProto";

package chat;

service ChatService {
	// legacy method. might remove later
    rpc SendMessage(SendMessageRequest)
        returns (SendMessageResponse);
        
    rpc GetUser(GetUserRequest)
    	returns (User);
    
    rpc ChatStream(stream ChatMessage)
    	returns (stream ChatMessage);
    
    rpc LogIn(LogInRequest)
    	returns (LogInResponse);
    
    // rpc MetaData(MetaDataRequest)
    	// returns (MetaDataResponse);
    
    rpc UploadFile(stream FileChunk)
    	returns (UploadResponse);
    
    rpc DownloadFile(DownloadRequest)
    	returns (stream FileChunk);
    	
}

message SendMessageRequest {
    string sender = 1;
    string receiver = 2;
    string message = 3;
    google.protobuf.Timestamp time_stamp = 4;
}

message SendMessageResponse {
    bool success = 1;
    string message = 2;
}

message User{
	string user_id = 1;
	string name = 2;
	string user_name = 3;
}

message GetUserRequest{
	string user_name = 1;
}

message ChatMessage{
	string sender = 1;
	string receiver = 2;
	string message = 3;
	google.protobuf.Timestamp time_stamp = 4;
}

message LogInRequest{
	string user_name = 1;
}

message LogInResponse{
	bool success = 1;
	string user_name = 2;
	string name = 3;
	string message = 4;
}

message FileChunk{

    string transfer_id = 1;
    string file_name = 2;
    int64 file_size = 3;
    int64 chunk_size = 4;
    int64 chunk_number = 5;
    int64 total_chunks = 6;
    bytes data = 7;
    bool last_chunk = 8;
	
}

message UploadResponse{
	bool success = 1;
	string transfer_id = 2;
	string message = 3;
	
}

message DownloadRequest{
	string transfer_id = 1;
	string file_name = 2;
}